<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrick LaVictoire</title>
<meta name="description" content="Patrick LaVictoire — mathematics, machine learning, AI alignment.">
<meta property="og:title" content="Patrick LaVictoire">
<meta property="og:description" content="I left academia for machine learning and AI alignment long before that was cool.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://patricklavictoire.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ec;
    --bg-tint: #efe9dd;
    --ink: #1a1a1a;
    --ink-soft: #5a5448;
    --accent: #2c466b;
    --accent-soft: #6e7c92;
    --rule: #ccc4b0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    font-size: 1.0625rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Subtle paper texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 25% 30%, rgba(0,0,0,0.012) 1px, transparent 1px),
      radial-gradient(circle at 75% 70%, rgba(0,0,0,0.012) 1px, transparent 1px);
    background-size: 4px 4px, 7px 7px;
    z-index: 0;
  }

  .container {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
    padding: 5rem 2rem 4rem;
    z-index: 1;
  }

  /* --- Header: name + portrait on the top line --- */

  .top-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2rem;
    align-items: center;
    margin-bottom: 2.5rem;
    animation: fadeUp 1s ease-out both;
  }

  .name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: clamp(3rem, 8.5vw, 5.25rem);
    line-height: 0.92;
    letter-spacing: -0.015em;
  }

  .name .first { display: block; }
  .name .last {
    margin-left: 1.25rem;
  }

  .portrait {
    width: clamp(110px, 18vw, 170px);
    aspect-ratio: 1;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    flex-shrink: 0;
    display: block;
  }

  /* --- Tagline (the centerpiece) --- */

  .tagline {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: clamp(1.5rem, 3.6vw, 2.1rem);
    line-height: 1.3;
    color: var(--ink);
    max-width: 38ch;
    margin-bottom: 2.5rem;
    animation: fadeUp 1s ease-out 0.15s both;
  }

  .tagline em {
    color: var(--accent);
  }

  /* --- Nav --- */

  nav {
    display: flex;
    gap: 1.75rem;
    flex-wrap: wrap;
    font-size: 0.95rem;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 0.85rem 0;
    font-style: italic;
    margin-bottom: 5rem;
    animation: fadeUp 1s ease-out 0.3s both;
  }

  nav a {
    color: var(--ink);
    text-decoration: none;
    position: relative;
    transition: color 0.2s;
  }

  nav a::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);
  }

  nav a:hover { color: var(--accent); }
  nav a:hover::after { transform: scaleX(1); }

  /* --- Section marker --- */

  .section-mark {
    display: inline-flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .section-mark::before {
    content: "§";
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    text-transform: none;
    letter-spacing: normal;
    color: var(--accent);
    line-height: 1;
  }

  /* --- Contact --- */

  .contact {
    animation: fadeUp 1s ease-out 0.45s both;
  }

  .contact-prompt {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: clamp(1.5rem, 3.5vw, 1.9rem);
    line-height: 1.25;
    margin-bottom: 1.5rem;
    color: var(--ink);
  }

  .contact-prompt em {
    color: var(--accent);
  }

  .email-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--accent);
    text-decoration: none;
    font-size: 1.1rem;
    font-style: italic;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 3px;
    transition: gap 0.25s ease, opacity 0.2s;
  }

  .email-link:hover { gap: 0.85rem; opacity: 0.75; }

  .email-link .arrow {
    font-style: normal;
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 1.3rem;
    line-height: 1;
  }

  /* --- Footer --- */

  footer {
    margin-top: 5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: 0.78rem;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    font-style: italic;
  }

  footer .colophon {
    color: var(--accent-soft);
  }

  /* --- Animations --- */

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Tighter spacing on small screens */
  @media (max-width: 480px) {
    .container { padding: 3.5rem 1.5rem 3rem; }
    .top-row { gap: 1.25rem; }
    .name .last { margin-left: 0.75rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="top-row">
      <h1 class="name">
        <span class="first">Patrick</span>
        <span class="last">LaVictoire</span>
      </h1>
      <img class="portrait" src="headshot.jpg" alt="Patrick LaVictoire">
    </div>

    <p class="tagline">
      I left academia for machine learning and AI alignment long before that was cool.
    </p>

    <nav>
      <a href="LaVictoireResume.pdf">Résumé</a>
      <a href="https://www.linkedin.com/in/patricklavictoire/">LinkedIn</a>
      <a href="https://arxiv.org/a/lavictoire_p_1">arXiv</a>
      <a href="https://www.lesswrong.com/users/orthonormal">LessWrong</a>
      <a href="mailto:patrick.lavic@gmail.com">Email</a>
    </nav>

    <footer>
      <span>© 2026 Patrick LaVictoire and Opus</span>
      <span class="colophon">Set in Instrument Serif &amp; Newsreader</span>
    </footer>
  </div>
</body>
</html>
